name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/validate-community.mjs
      - run: node scripts/plugin-footprint.mjs
      - run: node scripts/onboarding-smoke.mjs
      - name: Installed OpenCode wire contract (no provider inference)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          wire_harness_dir="$RUNNER_TEMP/spillway-wire-harness"
          npm install --prefix "$wire_harness_dir" --ignore-scripts --no-audit --no-fund opencode-ai@1.19.0
          node "$wire_harness_dir/node_modules/opencode-ai/postinstall.mjs"
          node scripts/harness-wire-smoke.mjs "$wire_harness_dir/node_modules/.bin/opencode"
  systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Provision disposable user and package
        shell: bash
        run: |
          set -euo pipefail
          if getent passwd spillway-ci >/dev/null || test -e /home/spillway-ci || test -L /home/spillway-ci; then
            exit 1
          fi
          package_staging="$RUNNER_TEMP/spillway-systemd-package"
          mkdir -m 700 "$package_staging"
          npm pack --ignore-scripts --pack-destination "$package_staging"
          sudo useradd --create-home --home-dir /home/spillway-ci --shell /bin/bash spillway-ci
          touch "$RUNNER_TEMP/spillway-systemd-account-created"
          sudo chmod 700 /home/spillway-ci
          sudo install -d -m 700 -o spillway-ci -g spillway-ci /home/spillway-ci/package /home/spillway-ci/tmp
          package_files=("$package_staging"/*.tgz)
          test "${#package_files[@]}" -eq 1
          sudo install -m 600 -o spillway-ci -g spillway-ci "${package_files[0]}" /home/spillway-ci/package.tgz
          sudo install -m 600 -o spillway-ci -g spillway-ci scripts/systemd-smoke.mjs /home/spillway-ci/systemd-smoke.mjs
          node_directory="$(dirname "$(command -v node)")"
          sudo -u spillway-ci /usr/bin/env -i HOME=/home/spillway-ci PATH="$node_directory:/usr/bin:/bin" TMPDIR=/home/spillway-ci/tmp NPM_CONFIG_USERCONFIG=/dev/null NPM_CONFIG_IGNORE_SCRIPTS=true npm install --prefix /home/spillway-ci/package --omit=dev --ignore-scripts --no-audit --no-fund /home/spillway-ci/package.tgz
          sudo loginctl enable-linger spillway-ci
          sudo systemctl start "user@$(id -u spillway-ci).service"
      - name: Actual installed-package systemd user lifecycle (synthetic inference)
        shell: bash
        run: |
          set -euo pipefail
          node_directory="$(dirname "$(command -v node)")"
          disposable_uid="$(id -u spillway-ci)"
          sudo -u spillway-ci /usr/bin/env -i HOME=/home/spillway-ci USER=spillway-ci LOGNAME=spillway-ci XDG_RUNTIME_DIR="/run/user/$disposable_uid" PATH="$node_directory:/usr/bin:/bin" TMPDIR=/home/spillway-ci/tmp SPILLWAY_SYSTEMD_SMOKE=1 SPILLWAY_INHERITED_SENTINEL=fixture-only OPENAI_API_KEY=fixture-only-not-a-credential node /home/spillway-ci/systemd-smoke.mjs --package /home/spillway-ci/package/node_modules/agent-spillway
      - name: Remove dedicated CI account and manager
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/spillway-systemd-account-created"; then
            disposable_uid="$(id -u spillway-ci)"
            test "$disposable_uid" -gt 0
            test "$disposable_uid" -ne "$(id -u)"
            cleanup_failed=0
            sudo loginctl disable-linger spillway-ci || cleanup_failed=1
            if sudo loginctl show-user spillway-ci >/dev/null 2>&1; then
              sudo loginctl terminate-user spillway-ci || cleanup_failed=1
            fi
            sudo systemctl stop "user@$disposable_uid.service" || cleanup_failed=1
            kill_status=0
            sudo pkill --signal KILL --uid "$disposable_uid" || kill_status=$?
            if test "$kill_status" -gt 1; then cleanup_failed=1; fi
            sudo userdel --remove spillway-ci || cleanup_failed=1
            exit "$cleanup_failed"
          fi
  marketplace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install pinned administrative Claude CLI
        shell: bash
        run: |
          set -euo pipefail
          marketplace_cli_dir="$RUNNER_TEMP/spillway-marketplace-cli"
          mkdir -m 700 "$marketplace_cli_dir"
          mkdir -m 700 "$marketplace_cli_dir/home" "$marketplace_cli_dir/tmp"
          node_directory="$(dirname "$(command -v node)")"
          /usr/bin/env -i HOME="$marketplace_cli_dir/home" TMPDIR="$marketplace_cli_dir/tmp" PATH="$node_directory:/usr/bin:/bin" NPM_CONFIG_USERCONFIG=/dev/null NPM_CONFIG_IGNORE_SCRIPTS=true npm install --prefix "$marketplace_cli_dir" --ignore-scripts --no-audit --no-fund @anthropic-ai/claude-code@2.1.296
          CLAUDE_INSTALLER="$marketplace_cli_dir/node_modules/@anthropic-ai/claude-code/install.cjs" python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          assert hashlib.sha256(Path(os.environ['CLAUDE_INSTALLER']).read_bytes()).hexdigest() == '32a7b2429d7447c5aa043e383bcf9a72e0b233dff66336ea4b5b32531da981ad'
          PY
          /usr/bin/env -i HOME="$marketplace_cli_dir/home" TMPDIR="$marketplace_cli_dir/tmp" PATH="$node_directory:/usr/bin:/bin" node "$marketplace_cli_dir/node_modules/@anthropic-ai/claude-code/install.cjs"
      - name: Current-source administrative install (no sessions or model calls)
        run: node scripts/marketplace-smoke.mjs --claude "$RUNNER_TEMP/spillway-marketplace-cli/node_modules/.bin/claude"
      - name: Anonymous public-source administrative install (no sessions or model calls)
        run: node scripts/marketplace-smoke.mjs --claude "$RUNNER_TEMP/spillway-marketplace-cli/node_modules/.bin/claude" --public-source
